[project]
name = "resumind-ai"
version = "2.0.0"
description = "Resumind AI - Executive Resume Intelligence Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.24.0",
    "reportlab>=4.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "supabase==2.34.1",
    "torch>=2.4.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
